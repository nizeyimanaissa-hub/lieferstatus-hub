_schema-version: 3.3.0
ID: lieferstatus-hub
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - npx tsc -p tsconfig.build.json
        - rm -rf .deploy/app-router/trackingapp
        - mkdir -p .deploy/app-router/trackingapp
        - cp -R app/trackingapp/webapp/. .deploy/app-router/trackingapp/
        - rm -rf .deploy/app-router/trackingapp/test
modules:
  - name: lieferstatus-hub-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: lieferstatus-hub-auth
      - name: lieferstatus-hub-db
      - name: lieferstatus-hub-destination

  - name: lieferstatus-hub-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: lieferstatus-hub-db
  - name: lieferstatus-hub
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: lieferstatus-hub-auth
      - name: lieferstatus-hub-destination
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: lieferstatus-hub-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: lieferstatus-hub-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Viewer (lieferstatus-hub ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Viewer'
          - name: 'Dispatcher (lieferstatus-hub ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Dispatcher'
    requires:
      - name: app-api
  - name: lieferstatus-hub-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: lieferstatus-hub-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
